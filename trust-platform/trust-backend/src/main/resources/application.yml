server:
  port: ${PORT:8080}

spring:
  application:
    name: trust-backend

  datasource:
    url: jdbc:h2:mem:trustdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false # H2 التطويري يعتمد على ddl-auto=update - Flyway يُفعَّل فقط في بروفايل postgres

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:trust-platform-dev-secret-key-change-in-production-minimum-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 دقيقة - رمز دخول قصير الأمد، يُجدَّد عبر /api/auth/refresh
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 أيام
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.trust: INFO
