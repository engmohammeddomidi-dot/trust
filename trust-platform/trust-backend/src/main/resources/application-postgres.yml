# بروفايل الإنتاج - PostgreSQL حقيقي بدل H2 in-memory. فعّله عبر SPRING_PROFILES_ACTIVE=postgres
spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/trustdb}
    username: ${POSTGRES_USER:trust}
    password: ${POSTGRES_PASSWORD:trustpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # المخطط تديره Flyway حصرًا، ليس Hibernate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false
